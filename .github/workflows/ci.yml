name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pylint --rcfile=pylintrc --fail-under=9 app tests

  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  frontend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - run: npm ci
      - run: npm run test

  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f docker-compose.yml -f docker-compose.prod.yml config -q

  build:
    runs-on: ${{ matrix.runner }}
    needs: [backend-lint, backend-test, frontend-test, compose-config]
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            suffix: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            suffix: arm64
    env:
      REGISTRY: ghcr.io
    steps:
      - uses: actions/checkout@v4
      - name: Tag corto del commit
        run: echo "SHA_SHORT=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      - name: Owner en minusculas (requisito de GHCR)
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          platforms: ${{ matrix.platform }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER_LC }}/pdf-actions-backend:sha-${{ env.SHA_SHORT }}-${{ matrix.suffix }}
          cache-from: type=gha,scope=backend-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=backend-${{ matrix.platform }}
      - uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          platforms: ${{ matrix.platform }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER_LC }}/pdf-actions-frontend:sha-${{ env.SHA_SHORT }}-${{ matrix.suffix }}
          cache-from: type=gha,scope=frontend-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=frontend-${{ matrix.platform }}

  merge-manifest:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push'
    env:
      REGISTRY: ghcr.io
    steps:
      - name: Tag corto del commit
        run: echo "SHA_SHORT=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      - name: Owner en minusculas (requisito de GHCR)
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Ensamblar manifest multi-arch
        run: |
          backend="${{ env.REGISTRY }}/${{ env.OWNER_LC }}/pdf-actions-backend"
          frontend="${{ env.REGISTRY }}/${{ env.OWNER_LC }}/pdf-actions-frontend"
          docker buildx imagetools create \
            --tag "$backend:sha-${{ env.SHA_SHORT }}" \
            --tag "$backend:latest" \
            "$backend:sha-${{ env.SHA_SHORT }}-amd64" \
            "$backend:sha-${{ env.SHA_SHORT }}-arm64"
          docker buildx imagetools create \
            --tag "$frontend:sha-${{ env.SHA_SHORT }}" \
            --tag "$frontend:latest" \
            "$frontend:sha-${{ env.SHA_SHORT }}-amd64" \
            "$frontend:sha-${{ env.SHA_SHORT }}-arm64"