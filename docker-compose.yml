version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
      - "443:443"
    environment:
      - MAX_UPLOAD_MB=${MAX_UPLOAD_MB:-50}
      - DOMAIN=${DOMAIN:-pdf-actions.13.59.92.146.sslip.io}
    volumes:
      - caddy_data:/data
    depends_on:
      - backend
    networks:
      - pdf-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-admin}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:-password}
      - MAX_UPLOAD_MB=${MAX_UPLOAD_MB:-50}
      - UVICORN_WORKERS=${UVICORN_WORKERS:-1}
    depends_on:
      - minio
    networks:
      - pdf-network

  minio:
    image: minio/minio
    ports:
      - "9000:9000" # API port
      - "9001:9001" # Console UI port
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-admin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-password}
    command: server /data --console-address ":9001"
    networks:
      - pdf-network
    volumes:
      - minio_data:/data

networks:
  pdf-network:
    driver: bridge

volumes:
  minio_data:
  caddy_data:
